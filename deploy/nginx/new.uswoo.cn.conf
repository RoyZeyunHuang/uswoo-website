# 新官网测试站 new.uswoo.cn（2026-11-10）。全站禁止收录。
# 80 端口一律跳转 HTTPS；443 转发到本机的应用容器（只监听回环地址）。
server {
        listen       80;
        server_name  new.uswoo.cn;
        location ^~ /.well-known/acme-challenge/ {
               root <测试站目录>/acme;
               default_type text/plain;
        }
        location / {
               return 301 https://$host$request_uri;
        }
}
server {
        listen       443 ssl;
        server_name  new.uswoo.cn;
        ssl_certificate      <证书目录>/fullchain.pem;
        ssl_certificate_key  <证书目录>/privkey.pem;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_protocols    TLSv1.2 TLSv1.3;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        gzip            on;
        gzip_types      text/plain application/xml text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;
        location = /robots.txt {
               default_type text/plain;
               return 200 "User-agent: *\nDisallow: /\n";
        }
        location / {
               proxy_pass http://127.0.0.1:<测试站容器端口>;
               proxy_http_version 1.1;
               proxy_set_header Host $host;
               proxy_set_header X-Real-IP $remote_addr;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Proto $scheme;
        }
}
