# 以下三段加在 uswoo.com 的站点文件中（2026-11-10）。

# ① 文件顶部（http 级）：允许的跨域来源。只有测试站需要，正式站与接口同源。
map $http_origin $uswoo_public_cors_origin {
        default "";
        "https://new.uswoo.cn" $http_origin;
}

# ② 443 的 server 块内，与 /vectraapi/ 并列：只转发这一个前缀，经内网到 Vectra 后端。
        location ^~ /api/uswoo/public/ {
               proxy_pass http://<Vectra 内网地址>/portal_backend_v2/api/uswoo/public/;
               proxy_set_header Host <Vectra 后端主机名>;
               proxy_set_header X-Real-IP $remote_addr;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Host $host;
               proxy_set_header X-Forwarded-Proto $scheme;
               proxy_http_version 1.1;
               proxy_set_header Connection "";
               proxy_connect_timeout 5s;
               proxy_read_timeout 30s;
               proxy_send_timeout 30s;
               client_max_body_size 1m;
               proxy_redirect off;
               proxy_hide_header Access-Control-Allow-Origin;
               add_header Access-Control-Allow-Origin $uswoo_public_cors_origin always;
               add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
               add_header Access-Control-Allow-Headers "Content-Type" always;
               add_header Access-Control-Max-Age 86400 always;
               if ($request_method = OPTIONS) {
                      return 204;
               }
               }

# ③ 站点级移动端跳转之前的放行条件，由只放行 /vectraapi/ 改为同时放行接口前缀。
        if ($uri ~ ^/(vectraapi|api/uswoo/public)/) {
               break;
        }
