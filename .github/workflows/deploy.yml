# 让任何人推到 main 都能真正发布到 Vercel。
#
# 为什么需要这个：Vercel 校验 HEAD 提交的作者是不是 Vercel 团队成员，不是就把
# 构建拦成 BLOCKED。团队里只有 Royce 有 Vercel 账号，所以别人推的代码永远发不出去。
#
# 试过但不行的办法：Deploy Hook。它触发的构建同样带着 git 提交信息，Vercel 照样
# 查作者，一样被拦（2026-10-15 实测）。
#
# 可行的办法就是这个：检测到 HEAD 作者不是 Royce 时，用 Royce 的身份补一个空提交
# 推回去。Vercel 看到新的 HEAD 作者合法就会正常构建。原作者的提交原样保留，
# 署名不受影响。
#
# 不需要任何 Vercel 凭证，只用 Actions 自带的 GITHUB_TOKEN。
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write        # 需要能把放行提交推回 main

env:
  # 必须是 Royce 在 GitHub 上验证过的邮箱，Vercel 靠它认出团队成员
  RELEASE_NAME: RoyZeyunHuang
  RELEASE_EMAIL: royhuang0103@gmail.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # 用默认 token 推送不会再次触发本 workflow，天然不会死循环

      - name: 判断是否需要放行提交
        id: check
        run: |
          author_email=$(git log -1 --format='%ae')
          subject=$(git log -1 --format='%s')
          echo "HEAD 作者: $author_email"
          echo "HEAD 信息: $subject"

          if [ "$author_email" = "$RELEASE_EMAIL" ]; then
            echo "作者本来就是 Royce，Vercel 会直接构建，无需补提交。"
            echo "need=false" >> "$GITHUB_OUTPUT"
          else
            echo "作者不是 Vercel 团队成员，需要补一个放行提交。"
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 补一个 Royce 名义的空提交以通过作者校验
        if: steps.check.outputs.need == 'true'
        run: |
          orig_author=$(git log -1 --format='%an')
          orig_subject=$(git log -1 --format='%s')
          git config user.name  "$RELEASE_NAME"
          git config user.email "$RELEASE_EMAIL"
          git commit --allow-empty -m "chore: 放行部署（$orig_author: $orig_subject）" \
                     -m "由 GitHub Action 自动创建。Vercel 校验 HEAD 提交作者是否为团队成员，
          原提交作者不在团队内会被拦成 BLOCKED，故补一个空提交放行。原提交的作者署名不变。"
          git push origin HEAD:main
          echo "✅ 已推送放行提交，Vercel 会就此开始构建。"

      - name: 说明
        run: |
          if [ "${{ steps.check.outputs.need }}" = "true" ]; then
            echo "本次由放行提交触发构建。"
          else
            echo "本次由原提交直接触发构建。"
          fi
          echo "约 30 秒后到 https://uswoo-website.vercel.app 刷新查看。"
